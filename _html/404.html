<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面未找到 | 导航站</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#2a2118 0%,#3d2e20 50%,#2a2118 100%);
    color:#f4f4f6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
  }
  .box{max-width:520px;width:100%}
  h1{font-size:72px;font-weight:800;color:#f0a93b;line-height:1;margin-bottom:8px}
  h2{font-size:20px;font-weight:600;margin-bottom:12px;color:#fff}
  p{font-size:14px;color:rgba(244,244,246,.65);line-height:1.7;margin-bottom:24px}
  .links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
  .links a{
    display:inline-block;padding:10px 20px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600;
    transition:background .15s,transform .1s;
  }
  .links a:hover{transform:translateY(-1px)}
  .a-home{background:#f0a93b;color:#2a2118}
  .a-xl{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
  .tip{margin-top:28px;font-size:12px;color:rgba(244,244,246,.4)}
</style>
</head>
<body>
<div class="box">
  <h1>404</h1>
  <h2>这个页面不存在</h2>
  <p>可能是目录名拼写有误、页面尚未创建，或路径已变更。<br>以下入口可以帮你快速找到想要的页面。</p>
  <div class="links">
    <a class="a-home" href="./">返回站点首页（输入栏）</a>
    <a class="a-xl" href="xl/">雅思站根目录</a>
  </div>
  <p class="tip">在首页搜索框输入目录名（如 xl、xl/vip）可直接跳转。</p>
</div>
</body>
</html>
