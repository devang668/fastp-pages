<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg" data-favicon-injected="true">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico" data-favicon-ico="true">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雅思口语闯关转盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;color:#fff;
  background:#1a1a2e;background-size:cover;background-position:center;
  background-attachment:fixed;transition:background-image 1s ease-in-out;
}
body::before{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,rgba(0,0,0,.6) 100%);
  z-index:0;pointer-events:none;
}
body>*{position:relative;z-index:1}

/* ===== 积分面板 ===== */
.score-panel{
  display:flex;gap:20px;margin:20px 0;
  background:rgba(255,255,255,.15);backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,.2);border-radius:50px;
  padding:10px 30px;box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.score-item{text-align:center}
.score-label{font-size:.75rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:1px}
.score-value{font-size:1.8rem;font-weight:900;color:#ffd200;text-shadow:0 2px 8px rgba(0,0,0,.5)}

h1{margin:10px 0 4px;font-size:1.6rem;font-weight:900;text-shadow:0 2px 12px rgba(0,0,0,.6);text-align:center}
.subtitle{font-size:.85rem;color:rgba(255,255,255,.8);margin-bottom:16px;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.5)}

/* ===== 板块导航（小按钮） ===== */
.section-nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;width:90%;max-width:520px}
.nav-card{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:999px;text-decoration:none;color:#fff;
  background:rgba(255,255,255,.12);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.22);box-shadow:0 2px 10px rgba(0,0,0,.2);
  font-size:.8rem;font-weight:600;line-height:1;white-space:nowrap;transition:all .2s;
}
.nav-card:hover{background:rgba(255,255,255,.26);transform:translateY(-1px)}

/* ===== 奖励动画 ===== */
.reward-popup{
  position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);
  font-size:3rem;font-weight:900;color:#ffd200;
  text-shadow:0 4px 20px rgba(0,0,0,.8);z-index:100;
  pointer-events:none;transition:transform .3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity .3s;
  opacity:0;
}
.reward-popup.show{transform:translate(-50%,-50%) scale(1);opacity:1}

/* ===== 转盘 ===== */
.wheel-wrap{position:relative;width:340px;height:340px;margin:0 auto}
canvas{display:block;border-radius:50%;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.pointer{
  position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;
  border-top:30px solid #ffd200;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6));z-index:2;
}
.center-btn{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:74px;height:74px;border-radius:50%;
  background:linear-gradient(135deg,#f7971e,#ffd200);border:3px solid rgba(255,255,255,.3);
  color:#1a1a2e;font-weight:900;font-size:.95rem;cursor:pointer;z-index:2;
  box-shadow:0 4px 20px rgba(247,151,30,.5);transition:transform .15s;
}
.center-btn:hover{transform:translate(-50%,-50%) scale(1.08)}
.center-btn:active{transform:translate(-50%,-50%) scale(.95)}
.center-btn:disabled{opacity:.5;cursor:not-allowed}

/* ===== 毛玻璃卡片 ===== */
.glass{
  width:90%;max-width:520px;margin:16px auto;
  background:rgba(255,255,255,.1);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:20px 24px;
  box-shadow:0 8px 32px rgba(0,0,0,.25);
}
.question-box{min-height:80px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.1rem;line-height:1.7;color:#ffd200}
.question-box .placeholder{color:rgba(255,255,255,.5);font-size:.95rem}

/* ===== 按钮 ===== */
.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0 6px}
.btn{
  padding:10px 22px;border:none;border-radius:12px;font-size:.9rem;font-weight:600;cursor:pointer;
  transition:all .2s;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.15);color:#fff;
}
.btn:hover{background:rgba(255,255,255,.22)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-speak{color:#7ec8e3}
.btn-record{color:#ff6b6b}
.btn-record.recording{background:#e05555;color:#fff;border-color:#e05555;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.btn-redeem{color:#2ecc71}
.btn-redeem.ready{background:rgba(46,204,113,.3);border-color:#2ecc71;color:#2ecc71;animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 5px rgba(46,204,113,.3)}50%{box-shadow:0 0 20px rgba(46,204,113,.6)}}
.btn-export{color:#3498db}

.timer-display{font-size:2.4rem;font-weight:900;font-variant-numeric:tabular-nums;color:#ffd200;text-align:center;margin:4px 0;min-height:44px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.timer-display.warning{color:#ff6b6b;animation:pulse .5s infinite}

.record-section h3,.edit-section h3{font-size:.95rem;color:rgba(255,255,255,.75);margin-bottom:10px;cursor:pointer;user-select:none}
.edit-section h3:hover,.record-section h3:hover{color:#ffd200}
.record-list{display:flex;flex-wrap:wrap;gap:8px}
.record-tag{background:rgba(255,210,0,.2);color:#ffd200;padding:4px 16px;border-radius:20px;font-size:.85rem;font-weight:600;border:1px solid rgba(255,210,0,.3)}
.record-empty{color:rgba(255,255,255,.4);font-size:.85rem}
.edit-body{display:none}.edit-body.open{display:block}
textarea{width:100%;height:150px;background:rgba(0,0,0,.3);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:14px;font-size:.9rem;line-height:1.7;resize:vertical;font-family:inherit}
textarea:focus{outline:none;border-color:#ffd200}
.btn-save{margin-top:10px;background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e;border:none;padding:10px 30px;border-radius:12px;font-weight:700;cursor:pointer;font-size:.9rem}
.hint{font-size:.75rem;color:rgba(255,255,255,.4);margin-top:8px}

.wallpaper-info{position:fixed;bottom:12px;right:16px;font-size:.7rem;color:rgba(255,255,255,.5);text-shadow:0 1px 4px rgba(0,0,0,.6);z-index:2;max-width:260px;text-align:right;cursor:pointer;transition:color .2s}
.wallpaper-info:hover{color:#ffd200}
.footer{text-align:center;padding:24px;font-size:.75rem;color:rgba(255,255,255,.4);text-shadow:0 1px 4px rgba(0,0,0,.4)}

/* ===== 录音预览面板 ===== */
.rec-preview{
  display:none;width:90%;max-width:520px;margin:16px auto;
  background:rgba(255,255,255,.1);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:20px 24px;
  box-shadow:0 8px 32px rgba(0,0,0,.25);
}
.rec-preview.open{display:block}
.rec-preview h3{margin-bottom:8px;color:rgba(255,255,255,.8);font-size:.95rem}
.rec-preview audio{width:100%;margin:10px 0 14px;border-radius:8px}
.rec-preview .rec-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.rec-preview .btn-ok{background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e;border:none;font-weight:700}
.rec-preview .btn-discard{
  border:1px solid rgba(255,255,255,.2);color:#ff6b6b;
}
</style>
</head>
<body>

<div class="score-panel">
  <div class="score-item">
    <div class="score-label">今日积分</div>
    <div class="score-value" id="todayScore">0</div>
  </div>
  <div class="score-item">
    <div class="score-label">历史总积分</div>
    <div class="score-value" id="totalScore">0</div>
  </div>
</div>

<h1>雅思口语闯关转盘</h1>
<p class="subtitle">转一下，录制两分钟，赚取积分，兑换壁纸！</p>

<div class="section-nav">
  <a class="nav-card" href="yue-du/lesson-01.html">阅读精讲</a>
  <a class="nav-card" href="yue-du/qa-index.html">阅读问答</a>
  <a class="nav-card" href="tingli/tl-index.html">听力精讲</a>
  <a class="nav-card" href="tingli/qa-tl-index.html">听力问答</a>
  <a class="nav-card" href="tingli/practice/index.html">听力考点自测</a>
  <a class="nav-card" href="vip/index.html">VIP 课程</a>
</div>

<div class="wheel-wrap">
  <div class="pointer"></div>
  <canvas id="wheel" width="340" height="340"></canvas>
  <button class="center-btn" id="spinBtn" onclick="spin()">SPIN</button>
</div>

<div class="glass question-box" id="questionBox">
  <span class="placeholder">点击中间按钮开始转盘</span>
</div>

<div class="controls">
  <button class="btn btn-speak" onclick="speakQuestion()">朗读问题</button>
  <button class="btn btn-record" id="recordBtn" onclick="toggleRecord()" disabled>录制音频并答题</button>
</div>

<div class="timer-display" id="timerDisplay"></div>

<div class="glass" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
  <button class="btn btn-redeem" id="redeemBtn" onclick="redeemWallpaper()" disabled>兑换随机壁纸 (需 5 分)</button>
  <button class="btn btn-export" onclick="exportReport()">导出今日 HTML 报告</button>
</div>

<div class="rec-preview" id="recPreview">
  <h3>录音预览</h3>
  <audio id="recAudio" controls preload="metadata"></audio>
  <div class="rec-actions">
    <button class="btn btn-ok" id="recOkBtn" onclick="saveRecording()">保存并下载</button>
    <button class="btn btn-discard" id="recDiscardBtn" onclick="discardRecording()">扔掉，不要了</button>
  </div>
</div>

<div class="glass record-section">
  <h3>今日闯关记录</h3>
  <div class="record-list" id="recordList"><span class="record-empty">还没有记录，快去转一个吧！</span></div>
</div>

<div class="glass edit-section">
  <h3 onclick="toggleEdit()">编辑 / 添加问题 <span id="editArrow">▸</span></h3>
  <div class="edit-body" id="editBody">
    <textarea id="questionInput" placeholder="每行写一个问题..."></textarea>
    <button class="btn-save" onclick="saveQuestions()">保存并更新转盘</button>
    <p class="hint">每行一个问题，保存后转盘自动更新。</p>
  </div>
</div>

<div class="footer">Made for Devang · 坚持就是胜利</div>
<div class="wallpaper-info" id="wpInfo" title="点击前往必应首页">正在加载今日壁纸...</div>
<div class="reward-popup" id="rewardPopup"></div>

<script>
/* ========== 游戏状态 ========== */
let todayScore = 0;
let totalScore = parseInt(localStorage.getItem('ielts_total_score') || '0');
let todayRecords = [];
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;
let timerInterval = null;
let timerSeconds = 120;
let recStartTime = 0;
let pendingRecording = null;

document.getElementById('totalScore').textContent = totalScore;

/* ========== 每日壁纸加载 ========== */
(function loadWallpaper(){
  const today = new Date();
  const dateStr = today.getFullYear() + '-' + (today.getMonth()+1) + '-' + today.getDate();
  const imgUrl = 'https://api.dujin.org/bing/1920.php?date=' + dateStr;
  const img = new Image();
  img.onload = function() {
    document.body.style.backgroundImage = "url('" + imgUrl + "')";
    document.getElementById('wpInfo').textContent = 'Bing 每日壁纸 (' + dateStr + ')';
  };
  img.onerror = function() {
    document.body.style.backgroundImage = "url('https://bing.ioliu.cn/v1/?w=1920&h=1080&date=" + dateStr + "')";
    document.getElementById('wpInfo').textContent = 'Bing 每日壁纸 (备用源)';
  };
  img.src = imgUrl;
})();

/* ========== 转盘核心 ========== */
const defaultQuestions = [
  "Describe your hometown and what you like about it.",
  "What do you usually do in your free time?",
  "Describe a book you have recently read.",
  "Do you prefer living in a city or the countryside? Why?",
  "Describe a person who has greatly influenced you.",
  "What kind of music do you enjoy listening to?",
  "Describe a memorable trip you have taken.",
  "How do you usually spend your weekends?",
  "Describe a skill you would like to learn in the future.",
  "What is your favorite season of the year and why?",
  "Describe a place you would like to visit in the future.",
  "How has technology changed your daily life?"
];
let questions = [...defaultQuestions];
let currentQuestion = null;
let currentIndex = -1;
let spinning = false;
let rotation = 0;
const colors = ["#e74c3c","#e67e22","#f1c40f","#2ecc71","#1abc9c","#3498db","#9b59b6","#e84393","#00cec9","#fd79a8","#6c5ce7","#00b894"];
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');

function drawWheel(rot){
  ctx.clearRect(0,0,340,340);
  const n = questions.length;
  const arc = (2*Math.PI)/n;
  ctx.save();ctx.translate(170,170);ctx.rotate(rot);
  for(let i=0;i<n;i++){
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,160,i*arc,(i+1)*arc);ctx.closePath();
    ctx.fillStyle = colors[i%colors.length];ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.3)";ctx.lineWidth = 2;ctx.stroke();
    ctx.save();ctx.rotate(i*arc+arc/2);ctx.textAlign = "right";ctx.fillStyle = "#fff";
    ctx.font = "bold 15px 'Segoe UI',sans-serif";ctx.shadowColor = "rgba(0,0,0,.5)";ctx.shadowBlur = 3;
    ctx.fillText(String(i+1), 146, 6);ctx.restore();
  }
  ctx.restore();
  ctx.beginPath();ctx.arc(170,170,162,0,2*Math.PI);ctx.strokeStyle = "rgba(255,210,0,.8)";ctx.lineWidth = 3;ctx.stroke();
}
drawWheel(0);

function spin(){
  if(spinning) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('recordBtn').disabled = true;
  stopTimer();
  const n = questions.length;
  const arc = 360/n;
  const targetIndex = Math.floor(Math.random()*n);
  const targetAngle = 360-(targetIndex*arc+arc/2)+270;
  const totalRotation = 360*(5+Math.floor(Math.random()*3))+targetAngle;
  const startRot = rotation%360;
  const startTime = performance.now();
  
  function easeOut(t){return 1-Math.pow(1-t,3);}
  function animate(now){
    const t = Math.min((now-startTime)/4000,1);
    const cur = startRot+(totalRotation-startRot)*easeOut(t);
    drawWheel(cur*Math.PI/180);
    if(t<1){requestAnimationFrame(animate);}
    else{
      rotation=totalRotation;spinning=false;
      document.getElementById('spinBtn').disabled=false;
      document.getElementById('recordBtn').disabled=false;
      currentIndex=targetIndex;currentQuestion=questions[targetIndex];
      document.getElementById('questionBox').innerHTML = '<div><strong style="color:#f7971e;font-size:1.2rem">No.'+(targetIndex+1)+'</strong><br>'+currentQuestion+'</div>';
      speakText(currentQuestion);
    }
  }
  requestAnimationFrame(animate);
}

function speakText(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.9;
  window.speechSynthesis.speak(u);
}
function speakQuestion(){ if(currentQuestion) speakText(currentQuestion); }

/* ========== 录制与游戏化核心 ========== */
async function toggleRecord(){
  if(!isRecording){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      recordedChunks = [];
      mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'audio/webm' });
        showRecPreview(blob);
        stream.getTracks().forEach(track => track.stop());
        finishRecording();
      };
      mediaRecorder.start();
      isRecording = true;
      document.getElementById('recordBtn').textContent = "停止录制并预览";
      document.getElementById('recordBtn').classList.add('recording');
      document.getElementById('spinBtn').disabled = true;
      startTimer();
    } catch(err){
      alert("无法访问麦克风。\n\n原因：浏览器出于安全考虑，可能限制了本地文件(file://)访问媒体设备。\n\n解决方法：\n1. 在当前文件夹打开命令行，运行: python -m http.server 8080\n2. 然后在浏览器访问: http://localhost:8080/口语转盘.html");
    }
  } else {
    mediaRecorder.stop();
  }
}

/* ===== 录音预览：听完再决定去留 ===== */
let recPendingBlob = null;
let recPreviewUrl = null;

function showRecPreview(blob){
  if(recPreviewUrl) URL.revokeObjectURL(recPreviewUrl);
  recPendingBlob = blob;
  recPreviewUrl = URL.createObjectURL(blob);
  document.getElementById('recAudio').src = recPreviewUrl;
  document.getElementById('recPreview').classList.add('open');
}

function saveRecording(){
  if(!recPendingBlob) return;
  const url = recPreviewUrl;
  const a = document.createElement('a');
  a.href = url;
  const dateStr = new Date().toLocaleDateString().replace(/\//g, '-');
  a.download = `口语练习_${dateStr}_No${currentIndex+1}.webm`;
  a.click();
  closeRecPreview();
}

function discardRecording(){
  closeRecPreview();
}

function closeRecPreview(){
  document.getElementById('recPreview').classList.remove('open');
  document.getElementById('recAudio').removeAttribute('src');
  if(recPreviewUrl){ URL.revokeObjectURL(recPreviewUrl); recPreviewUrl = null; }
  recPendingBlob = null;
}

function finishRecording(){
  isRecording = false;
  document.getElementById('recordBtn').textContent = "录制音频并答题";
  document.getElementById('recordBtn').classList.remove('recording');
  document.getElementById('spinBtn').disabled = false;
  stopTimer();
  
  // 随机奖励 1-3 分
  const reward = Math.floor(Math.random() * 3) + 1;
  todayScore += reward;
  totalScore += reward;
  localStorage.setItem('ielts_total_score', totalScore);
  
  updateScoreUI();
  showRewardAnimation(reward);
  addRecord(reward);
}

function updateScoreUI(){
  document.getElementById('todayScore').textContent = todayScore;
  document.getElementById('totalScore').textContent = totalScore;
  const redeemBtn = document.getElementById('redeemBtn');
  if(todayScore >= 5){
    redeemBtn.disabled = false;
    redeemBtn.classList.add('ready');
    redeemBtn.textContent = "兑换随机壁纸 (点击消耗 5 分)";
  } else {
    redeemBtn.disabled = true;
    redeemBtn.classList.remove('ready');
    redeemBtn.textContent = `兑换随机壁纸 (还需 ${5 - todayScore} 分)`;
  }
}

function showRewardAnimation(reward){
  const popup = document.getElementById('rewardPopup');
  popup.textContent = `+ ${reward} 分！`;
  popup.classList.add('show');
  setTimeout(() => { popup.classList.remove('show'); }, 1500);
}

function redeemWallpaper(){
  if(todayScore >= 5){
    todayScore -= 5;
    updateScoreUI();
    const randomIdx = Math.floor(Math.random() * 8); // 随机过去 8 天的壁纸
    const imgUrl = `https://api.dujin.org/bing/1920.php?idx=${randomIdx}`;
    const img = new Image();
    img.onload = () => {
      document.body.style.backgroundImage = `url('${imgUrl}')`;
      document.getElementById('wpInfo').textContent = `兑换成功：必应历史壁纸 (倒数第 ${randomIdx} 天)`;
      showRewardAnimation("壁纸兑换成功！");
    };
    img.src = imgUrl;
  }
}

/* ========== 计时器 ========== */
function startTimer(){
  timerSeconds = 120;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerSeconds--;
    updateTimerDisplay();
    if(timerSeconds <= 0){
      if(isRecording) mediaRecorder.stop();
    }
  }, 1000);
}
function stopTimer(){
  clearInterval(timerInterval);
  document.getElementById('timerDisplay').textContent = "";
  document.getElementById('timerDisplay').classList.remove('warning');
}
function updateTimerDisplay(){
  const m = Math.floor(timerSeconds/60), s = timerSeconds%60;
  const el = document.getElementById('timerDisplay');
  el.textContent = m + ':' + String(s).padStart(2, '0');
  if(timerSeconds <= 15) el.classList.add('warning');
  else el.classList.remove('warning');
}

/* ========== 记录与导出 ========== */
function addRecord(reward){
  const timeStr = new Date().toLocaleTimeString();
  todayRecords.push({ time: timeStr, idx: currentIndex+1, question: currentQuestion, reward: reward });
  renderRecords();
}
function renderRecords(){
  const el = document.getElementById('recordList');
  if(!todayRecords.length){
    el.innerHTML = '<span class="record-empty">还没有记录，快去转一个吧！</span>';
  } else {
    el.innerHTML = todayRecords.map(r => 
      `<span class="record-tag">No.${r.idx} (+${r.reward}分)</span>`
    ).join('');
  }
}

function exportReport(){
  const dateStr = new Date().toLocaleDateString();
  let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>雅思口语练习报告 - ${dateStr}</title>
  <style>body{font-family:'Segoe UI',sans-serif;max-width:800px;margin:30px auto;padding:20px;background:#f8f9fa;color:#333;line-height:1.6}
  h1{color:#f7971e;text-align:center;border-bottom:3px solid #ffd200;padding-bottom:10px}
  .stat{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 4px 15px rgba(0,0,0,0.05);display:flex;justify-content:space-around;text-align:center}
  .stat div h3{color:#f7971e;font-size:2rem;margin:0}.stat div p{color:#888;margin:5px 0 0}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.05)}
  th,td{padding:12px 15px;border-bottom:1px solid #eee;text-align:left}
  th{background:#f7971e;color:#fff;font-weight:600}
  tr:last-child td{border-bottom:none}.footer{text-align:center;margin-top:30px;color:#aaa;font-size:0.9em}</style></head><body>
  <h1>雅思口语闯关日报</h1>
  <div class="stat">
    <div><h3>${todayScore}</h3><p>今日获得积分</p></div>
    <div><h3>${totalScore}</h3><p>历史总积分</p></div>
    <div><h3>${todayRecords.length}</h3><p>今日练习次数</p></div>
  </div>
  <h2 style="color:#333;margin-bottom:15px">练习明细</h2>
  <table><tr><th>时间</th><th>题目</th><th>获得奖励</th></tr>`;
  
  todayRecords.forEach(r => {
    html += `<tr><td>${r.time}</td><td><strong>No.${r.idx}</strong><br><span style="color:#666;font-size:0.9em">${r.question}</span></td><td style="color:#2ecc71;font-weight:bold">+${r.reward} 分</td></tr>`;
  });
  
  html += `</table><p class="footer">Keep going, Devang! 每一个微小的进步，都在重塑你的大脑。<br>生成时间: ${new Date().toLocaleString()}</p></body></html>`;
  
  const blob = new Blob([html], {type: 'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `口语闯关报告_${dateStr.replace(/\//g, '-')}.html`;
  a.click();
}

/* ========== 编辑问题 ========== */
function toggleEdit(){
  const body = document.getElementById('editBody');
  const arrow = document.getElementById('editArrow');
  body.classList.toggle('open');
  arrow.textContent = body.classList.contains('open') ? '▾' : '▸';
  if(body.classList.contains('open')) document.getElementById('questionInput').value = questions.join('\n');
}
function saveQuestions(){
  const raw = document.getElementById('questionInput').value;
  const list = raw.split('\n').map(s => s.trim()).filter(s => s.length > 0);
  if(list.length < 2){alert('至少需要 2 个问题哦！');return;}
  if(list.length > 24){alert('最多支持 24 个问题，太多转盘会挤～');return;}
  questions = list;currentQuestion = null;currentIndex = -1;rotation = 0;
  drawWheel(0);
  document.getElementById('questionBox').innerHTML = '<span class="placeholder">转盘已更新！点击 SPIN 开始</span>';
  document.getElementById('recordBtn').disabled = true;
  document.getElementById('editBody').classList.remove('open');
  document.getElementById('editArrow').textContent = '▸';
}
</script>
</body>
</html>
