<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- dark rounded background, matches site theme (#1a1a2e) -->
  <rect width="64" height="64" rx="13" fill="#1a1a2e"/>
  <!-- subtle inner ring for depth -->
  <rect x="1" y="1" width="62" height="62" rx="12" fill="none" stroke="#ffd200" stroke-opacity="0.18" stroke-width="1"/>

  <!-- wheel: 6 alternating gold / dark slices -->
  <g transform="translate(32 34)">
    <!-- slice 1 (top, gold dim) -->
    <path d="M0 -20 L17.32 -10 A20 20 0 0 1 0 0 Z" fill="#ffd200" fill-opacity="0.55"/>
    <!-- slice 2 (upper-right, gold bright) -->
    <path d="M0 -20 L-17.32 -10 A20 20 0 0 0 0 0 Z" fill="#ffd200"/>
    <!-- slice 3 (lower-right, gold dim) -->
    <path d="M0 20 L17.32 10 A20 20 0 0 0 0 0 Z" fill="#ffd200" fill-opacity="0.55"/>
    <!-- slice 4 (bottom, gold bright) -->
    <path d="M0 20 L-17.32 10 A20 20 0 0 1 0 0 Z" fill="#ffd200"/>
    <!-- slice 5 (lower-left, gold dim) -->
    <path d="M-17.32 -10 L0 -20 A20 20 0 0 1 -10 17.32 Z" fill="#ffd200" fill-opacity="0.55"/>
    <!-- slice 6 (upper-left, gold bright) -->
    <path d="M17.32 -10 L0 -20 A20 20 0 0 0 10 17.32 Z" fill="#ffd200"/>
    <!-- hub shadow -->
    <circle r="9" fill="#1a1a2e"/>
    <!-- center button (orange, matches site) -->
    <circle r="6.5" fill="#f7971e"/>
    <circle r="6.5" fill="none" stroke="#ffd200" stroke-width="1" stroke-opacity="0.7"/>
    <!-- inner "I" for IELTS, white -->
    <rect x="-1" y="-4.5" width="2" height="9" fill="#fff"/>
    <rect x="-3" y="-4.5" width="6" height="1.6" fill="#fff"/>
    <rect x="-3" y="2.9" width="6" height="1.6" fill="#fff"/>
  </g>

  <!-- pointer at top, gold -->
  <path d="M32 4 L27.5 13 L36.5 13 Z" fill="#ffd200" stroke="#1a1a2e" stroke-width="0.6" stroke-linejoin="round"/>
</svg>
