const grid = document.getElementById("grid");
const player = document.getElementById("player");
const counter = document.getElementById("counter");
const player2 = new Audio();
let queue = [];
let qBtn = null;

function slug(w){
  return w.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
}
function pad(n){ return String(n).padStart(2, "0"); }

function render(){
  grid.innerHTML = WORDS.map(w => `
    <article class="card" data-w="${w.word.toLowerCase()}" data-all="${(w.word + " " + (w.meaning||"") + " " + (w.en||"")).toLowerCase()}">
      <span class="num">${w.n}</span>
      <div class="word">${w.word}${w.nm ? `<span class="note">${w.nm}</span>` : ""}</div>
      <div class="ipa">${w.ipa}</div>
      <div class="meaning"><b>${w.meaning.split(" ")[0]}</b>${w.meaning.split(" ").slice(1).join(" ") || ""}</div>
      ${w.en ? `<div class="example">${w.en}<div class="zh">${w.zh}</div></div>` : `<div class="noex">专有名词，无例句</div>`}
      <div class="plays">
        <button class="play au" data-src="audio-fuzzy/${pad(w.n)}_${slug(w.word)}_AU.mp3">澳·单词</button>
        <button class="play ie" data-src="audio-fuzzy/${pad(w.n)}_${slug(w.word)}_IE.mp3">爱·单词</button>
        ${w.en ? `<button class="play au" data-src="audio-fuzzy/${pad(w.n)}_${slug(w.word)}_sentence_AU.mp3">澳·例句</button>
        <button class="play ie" data-src="audio-fuzzy/${pad(w.n)}_${slug(w.word)}_sentence_IE.mp3">爱·例句</button>` : ""}
      </div>
    </article>`).join("");
  updateCounter();
}

function updateCounter(){
  const shown = document.querySelectorAll(".card:not(.hidden)").length;
  counter.textContent = `显示 ${shown} / ${WORDS.length}`;
}

function playSrc(src, btn){
  if (player.src.endsWith(src) && !player.paused){ player.pause(); player.currentTime = 0; btn?.classList.remove("playing"); return; }
  document.querySelectorAll(".play.playing").forEach(b => b.classList.remove("playing"));
  player.src = src;
  player.play();
  btn?.classList.add("playing");
}

grid.addEventListener("click", e => {
  const btn = e.target.closest(".play");
  if (!btn) return;
  const src = btn.dataset.src;
  queue = [];
  document.querySelectorAll(".play.playing").forEach(b => b.classList.remove("playing"));
  playSrc(src, btn);
});

document.getElementById("playAllAU").addEventListener("click", () => playAll("AU", false));
document.getElementById("playAllIE").addEventListener("click", () => playAll("IE", false));
document.getElementById("playAllSentAU").addEventListener("click", () => playAll("AU", true));
document.getElementById("playAllSentIE").addEventListener("click", () => playAll("IE", true));

function playAll(tag, sentence){
  const words = [...WORDS].filter(w => !sentence || w.en);
  queue = words.map(w => `audio-fuzzy/${pad(w.n)}_${slug(w.word)}${sentence ? "_sentence" : ""}_${tag}.mp3`);
  document.querySelectorAll(".play.playing").forEach(b => b.classList.remove("playing"));
  playQueue();
}

function playQueue(){
  if (!queue.length){ document.querySelectorAll(".play.playing").forEach(b => b.classList.remove("playing")); return; }
  const src = queue.shift();
  const btn = document.querySelector(`.play[data-src="${src}"]`);
  btn?.classList.add("playing");
  player.src = src;
  player.play();
}

player.addEventListener("ended", () => {
  document.querySelectorAll(".play.playing").forEach(b => b.classList.remove("playing"));
  playQueue();
});

document.getElementById("stopAll").addEventListener("click", () => {
  player.pause(); player.currentTime = 0;
  queue = [];
  document.querySelectorAll(".play.playing").forEach(b => b.classList.remove("playing"));
});

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".card").forEach(card => {
    card.classList.toggle("hidden", q !== "" && !card.dataset.all.includes(q));
  });
  updateCounter();
});

render();
</script>
