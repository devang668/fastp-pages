<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一键复制</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            padding: 24px;
            max-width: 720px;
            margin: 0 auto;
        }
        h1 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
        }
        .item {
            background: #fff;
            border: 1px solid #e6e6e6;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .item .name {
            flex: 1;
            font-size: 15px;
            color: #222;
            word-break: break-all;
        }
        .item .url {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .copy-btn {
            flex-shrink: 0;
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
        }
        .copy-btn:hover { background: #357abd; }
        .copy-btn:active { background: #2a5f9e; }
        .copy-btn.copied {
            background: #67c23a;
        }
    </style>
</head>
<body>
    <h1>复制列表</h1>
    <div id="list">加载中...</div>

    <script>
        // 加载 JSON 并渲染
        fetch('./links.json')
            .then(r => r.json())
            .then(data => {
                const root = document.getElementById('list');
                root.innerHTML = '';
                data.forEach((item, idx) => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.innerHTML = `
                        <div style="flex:1; min-width:0;">
                            <div class="name">${item.name}</div>
                            <div class="url">${item.url}</div>
                        </div>
                        <button class="copy-btn" data-idx="${idx}">复制</button>
                    `;
                    root.appendChild(div);
                });

                // 绑定复制事件
                document.querySelectorAll('.copy-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const idx = btn.dataset.idx;
                        const url = data[idx].url;
                        copyText(url, btn);
                    });
                });
            })
            .catch(err => {
                document.getElementById('list').innerText = '加载失败: ' + err;
            });

        // 复制函数
        function copyText(text, btn) {
            // 优先用 Clipboard API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => onSuccess(btn));
                return;
            }
            // fallback: textarea
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                onSuccess(btn);
            } catch (e) {
                alert('复制失败,请手动复制: ' + text);
            }
            document.body.removeChild(ta);
        }

        function onSuccess(btn) {
            const orig = btn.innerText;
            btn.innerText = '✓ 已复制';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerText = orig;
                btn.classList.remove('copied');
            }, 1200);
        }
    </script>
</body>
</html>
