        @layer utilities {

            }
            .note {
                @apply text-gray-600 text-sm mt-2 overflow-hidden max-h-0 opacity-0 transition-all duration-200;
            }
            .title {
                @apply text-blue-600 font-medium cursor-pointer hover:text-blue-800;
            }
            .offline {
                @apply fixed top-3 right-3 bg-red-500 text-white px-2 py-1 text-xs rounded-full opacity-0 transition-opacity duration-300;
            }
        }
    </style>
</head>

        // DOM引用
        const cardsContainer = document.getElementById('cards');
        const offlineIndicator = document.getElementById('offline');

        // 生成卡片 (优化内存占用)
        function buildCards() {
            let html = '';
            items.forEach((item, i) => {
                html += `
                <div class="card">
                    <div class="title" data-url="${item.url}">${item.title}</div>
                    <div class="note">${item.note}</div>
                </div>`;
            });
            cardsContainer.innerHTML = html;
            
            // 绑定事件 (使用事件委托减少事件监听器数量)
            cardsContainer.addEventListener('mouseenter', (e) => {
                const title = e.target.closest('.title');
                if (title) {
                    title.nextElementSibling.style.maxHeight = '100px';
                    title.nextElementSibling.style.opacity = '1';
                }
            });
            
            cardsContainer.addEventListener('mouseleave', (e) => {
                const title = e.target.closest('.title');
                if (title) {
                    title.nextElementSibling.style.maxHeight = '0';
                    title.nextElementSibling.style.opacity = '0';
                }
            });
            
            cardsContainer.addEventListener('dblclick', (e) => {
                const title = e.target.closest('.title');
                if (title) {
                    window.open(title.dataset.url, '_blank');
                }
            });
        }

        // 检查网络状态
        function checkNetwork() {
            offlineIndicator.style.opacity = navigator.onLine ? '0' : '1';
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            buildCards();
            checkNetwork();
            window.addEventListener('online', checkNetwork);
            window.addEventListener('offline', checkNetwork);
        });
    </script>
